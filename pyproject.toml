[tool.poetry]
name = "alphagenesis"
version = "0.1.0"
description = "An institutional-grade, AI-powered quantitative trading system engineered to generate sustainable alpha in volatile crypto markets"
authors = ["AlphaGenesis Team"]
readme = "README.md"
license = "MIT"
packages = [{include = "alphagenesis"}]

[tool.poetry.dependencies]
python = "^3.9"
# Data manipulation and analysis
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"

# Machine Learning - Deep Learning
torch = "^2.0.0"
transformers = "^4.30.0"
tensorflow = "^2.13.0"
keras = "^2.13.0"

# Machine Learning - Reinforcement Learning
stable-baselines3 = "^2.0.0"
gym = "^0.26.0"
gymnasium = "^0.28.0"

# Machine Learning - Traditional ML
scikit-learn = "^1.3.0"
xgboost = "^1.7.0"
lightgbm = "^4.0.0"

# Financial and Statistical Analysis
arch = "^6.2.0"  # GARCH models
statsmodels = "^0.14.0"
ta-lib = {version = "^0.4.28", optional = true}
ta = "^0.11.0"  # Alternative technical analysis library

# API and Data Fetching
requests = "^2.31.0"
websocket-client = "^1.6.0"
aiohttp = "^3.8.0"
ccxt = "^4.0.0"  # Cryptocurrency exchange trading library

# Database and Caching
sqlalchemy = "^2.0.0"
redis = "^4.6.0"
psycopg2-binary = "^2.9.0"

# Configuration and Environment
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
pyyaml = "^6.0"

# Logging and Monitoring
loguru = "^0.7.0"
prometheus-client = "^0.17.0"

# Backtesting
backtrader = "^1.9.78"
zipline-reloaded = {version = "^3.0.0", optional = true}

# Utilities
python-dateutil = "^2.8.0"
pytz = "^2023.3"
tqdm = "^4.65.0"
joblib = "^1.3.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.11.0"
hypothesis = "^6.82.0"

# Code Quality
black = "^23.7.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
mypy = "^1.4.0"
pylint = "^2.17.0"
pre-commit = "^3.3.0"

# Documentation
sphinx = "^7.0.0"
sphinx-rtd-theme = "^1.2.0"

# Jupyter
jupyter = "^1.0.0"
ipykernel = "^6.24.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
plotly = "^5.15.0"

[tool.poetry.extras]
talib = ["ta-lib"]
zipline = ["zipline-reloaded"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=alphagenesis --cov-report=html --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
