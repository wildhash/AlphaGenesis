apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphagenesis-trader
  namespace: trading
  labels:
    app: alphagenesis
    component: trader
spec:
  replicas: 3  # Multiple instances for redundancy
  selector:
    matchLabels:
      app: alphagenesis
      component: trader
  template:
    metadata:
      labels:
        app: alphagenesis
        component: trader
    spec:
      containers:
      - name: trader
        image: alphagenesis:latest
        imagePullPolicy: Always
        resources:
          limits:
            nvidia.com/gpu: 1  # GPU for ML inference
            memory: "8Gi"
            cpu: "4"
          requests:
            cpu: "2"
            memory: "4Gi"
        env:
        - name: WEEX_API_KEY
          valueFrom:
            secretKeyRef:
              name: weex-credentials
              key: api-key
        - name: WEEX_API_SECRET
          valueFrom:
            secretKeyRef:
              name: weex-credentials
              key: api-secret
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MAX_POSITION_SIZE
          value: "0.10"
        - name: ENABLE_PAPER_TRADING
          value: "false"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true
        - name: data-storage
          mountPath: /data
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: alphagenesis-models
      - name: data-storage
        persistentVolumeClaim:
          claimName: alphagenesis-data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - alphagenesis
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: alphagenesis-trader-service
  namespace: trading
spec:
  selector:
    app: alphagenesis
    component: trader
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alphagenesis-trader-hpa
  namespace: trading
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphagenesis-trader
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
