# AlphaGenesis Configuration

# WEEX Exchange Settings
weex:
  api_key: ${WEEX_API_KEY}
  api_secret: ${WEEX_API_SECRET}
  api_passphrase: ${WEEX_API_PASSPHRASE}
  base_url: https://api.weex.com

# Trading Settings
trading:
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
  timeframe: 1h
  lookback_period: 100

# Risk Management
risk:
  max_position_size: 0.1
  max_leverage: 3.0
  stop_loss_percent: 0.02
  take_profit_percent: 0.05
  var_confidence_level: 0.95
  max_drawdown_limit: 0.15

# Model Configuration
model:
  checkpoint_dir: ./models/saved
  device: cuda  # cuda or cpu
  
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
  
  transformer:
    d_model: 128
    nhead: 8
    num_layers: 3
  
  rl:
    algorithm: PPO  # PPO, A2C, or DQN
    total_timesteps: 100000

# Backtesting
backtest:
  initial_capital: 100000
  commission_rate: 0.001
  slippage_rate: 0.0005
  start_date: "2023-01-01"
  end_date: "2023-12-31"

# Feature Engineering
features:
  technical_indicators:
    - RSI
    - MACD
    - Bollinger_Bands
    - ATR
    - Stochastic
  lookback_windows:
    - 5
    - 10
    - 20
    - 50

# Logging
logging:
  level: INFO
  file: ./logs/alphagenesis.log
  rotation: 100 MB
  retention: 30 days

# Database
database:
  url: postgresql://user:password@localhost:5432/alphagenesis
  pool_size: 10
  
# Redis Cache
redis:
  url: redis://localhost:6379/0
  cache_ttl: 3600
